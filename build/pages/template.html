<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>上海精智 AI 开发实训营 · 成果门户</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e6e8ec; --ink:#1c2333; --mute:#7b8496;
  --blue:#2f6feb; --green:#17a673; --amber:#e0a02e; --red:#d9534f; --purple:#7b61ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 "PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:21px;margin:0 0 4px;letter-spacing:.2px}
.sub{color:var(--mute);font-size:12.5px}
.live{display:inline-flex;align-items:center;gap:6px;background:#eaf7f1;color:#12795a;
  border:1px solid #cfeade;border-radius:999px;padding:4px 11px;font-size:12px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.kpi .n{font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1.15}
.kpi .l{font-size:12px;color:var(--mute);margin-top:3px}
.kpi .d{font-size:11.5px;color:var(--mute);margin-top:6px}
section{margin-bottom:26px}
h2{font-size:14px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 small{font-weight:400;color:var(--mute);font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.funnel{display:flex;flex-direction:column;gap:11px}
.frow{display:grid;grid-template-columns:96px 1fr 58px;align-items:center;gap:12px;font-size:12.5px}
.ftrack{height:9px;background:#eef0f4;border-radius:6px;overflow:hidden}
.fbar{height:100%;border-radius:6px;transition:width .5s ease}
.fnum{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid #f0f1f4;white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:11.5px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.grid12{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ind{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#fcfcfd}
.ind .k{font-size:11px;color:var(--mute);letter-spacing:.4px}
.ind .t{font-size:12.5px;margin:2px 0 8px}
.ind .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.ind .v span{font-size:11.5px;color:var(--mute);font-weight:400;margin-left:3px}
.bar{height:5px;background:#eef0f4;border-radius:4px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
input[type=search]{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);
  border-radius:9px;font-size:13px;background:#fff;outline:none}
input[type=search]:focus{border-color:var(--blue)}
.chip{border:1px solid var(--line);background:#fff;color:var(--mute);border-radius:999px;
  padding:7px 13px;font-size:12px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.p{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px}
.p .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.p .nm{font-weight:600;font-size:13.5px}
.p .gp{font-size:11.5px;color:var(--mute);margin-top:2px}
.s{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.s.in_org{background:#eaf7f1;color:#12795a}
.s.invited{background:#fff5e3;color:#9a6a12}
.s.check{background:#fdeceb;color:#a33b38}
.s.no_account{background:#f0f1f4;color:#7b8496}
.p .meta{display:flex;gap:12px;margin-top:10px;padding-top:9px;border-top:1px solid #f2f3f6;
  font-size:11.5px;color:var(--mute)}
.p .meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.empty{color:var(--mute);font-size:13px;padding:18px 0;text-align:center}
footer{color:var(--mute);font-size:11.5px;line-height:1.9;border-top:1px solid var(--line);padding-top:16px}
.p{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.p:hover{border-color:#c6d2ea;box-shadow:0 3px 12px rgba(30,50,90,.07)}
.p .go{font-size:11px;color:var(--blue);margin-top:8px;opacity:0;transition:opacity .15s}
.p:hover .go{opacity:1}
.ov{position:fixed;inset:0;background:rgba(18,24,38,.42);opacity:0;pointer-events:none;transition:opacity .18s;z-index:50}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;height:100%;width:min(460px,92vw);background:#fff;z-index:51;
  transform:translateX(102%);transition:transform .22s ease;overflow-y:auto;box-shadow:-8px 0 30px rgba(20,30,50,.16)}
.dr.on{transform:none}
.dr .hd{padding:22px 22px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.dr .hd h3{margin:0;font-size:17px}
.dr .hd .g{color:var(--mute);font-size:12.5px;margin-top:4px;line-height:1.5}
.dr .bd{padding:18px 22px 48px}
.x{position:absolute;top:16px;right:18px;border:0;background:#f0f1f4;width:28px;height:28px;
  border-radius:50%;cursor:pointer;font-size:14px;color:var(--mute)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.kv div{background:#f8f9fb;border-radius:9px;padding:10px 11px}
.kv b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.2}
.kv span{font-size:11px;color:var(--mute)}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ev div{display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 9px;border-radius:7px;background:#fafbfc}
.ev i{width:7px;height:7px;border-radius:50%;background:#d6dae1;flex:none}
.ev div.yes i{background:var(--green)}
.ev div.no{color:#a3aab8}
.dr h4{font-size:12px;color:var(--mute);font-weight:500;margin:0 0 9px;letter-spacing:.3px}
@media(max-width:860px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid12{grid-template-columns:repeat(2,1fr)}
  .frow{grid-template-columns:78px 1fr 46px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>上海精智 AI 开发实训营 · 成果门户</h1>
      <div class="sub" id="sub">—</div>
    </div>
    <div class="live"><span class="dot"></span><span id="live">数据同步中</span></div>
  </header>

  <div class="kpis" id="kpis"></div>

  <section>
    <h2>参与漏斗 <small>每一步都是上一层的子集</small></h2>
    <div class="panel"><div class="funnel" id="funnel"></div></div>
  </section>

  <section>
    <h2>分组进度 <small>按人数排序</small></h2>
    <div class="panel" style="overflow-x:auto">
      <table id="gtab">
        <thead><tr>
          <th>分组</th><th class="num">人数</th><th class="num">已入组织</th>
          <th class="num">已建仓</th><th class="num">有产出</th>
          <th class="num">日报</th><th class="num">文件</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>12 项评分证据齐备度 <small>只统计「有候选文件」的人数，不代表质量</small></h2>
    <div class="grid12" id="inds"></div>
  </section>

  <section>
    <h2>学员进度 <small>姓名缩写 · 不含账号与仓库名</small></h2>
    <div class="tools">
      <input type="search" id="q" placeholder="搜索姓名、分组…">
      <button class="chip on" data-f="all">全部</button>
      <button class="chip" data-f="in_org">已入组织</button>
      <button class="chip" data-f="invited">待接受</button>
      <button class="chip" data-f="no_account">未交账号</button>
      <button class="chip" data-f="has_repo">已建仓</button>
    </div>
    <div class="people" id="people"></div>
  </section>

  <footer id="foot"></footer>
</div>

<div class="ov" id="ov"></div>
<aside class="dr" id="dr">
  <button class="x" id="x" aria-label="关闭">✕</button>
  <div class="hd"><h3 id="dn"></h3><div class="g" id="dg"></div></div>
  <div class="bd" id="db"></div>
</aside>

<script>
const DATA = /*__DATA__*/;

const STATUS = {in_org:'已入组织', invited:'已邀待接受', check:'待核查', no_account:'未交账号'};
const fmt = n => (n||0).toLocaleString('zh-CN');

document.getElementById('sub').textContent =
  `组织 ${DATA.org} · 快照 ${DATA.snapshot_at}（北京时间） · 每 10 分钟自动采集`;
document.getElementById('live').textContent = '自动更新中 · 快照 ' + DATA.snapshot_at.slice(11);

const T = DATA.totals;
const kpis = [
  ['报名人数', T.roster, '定稿名单'],
  ['已交账号', T.has_account, `${T.no_account} 人未交`],
  ['已入组织', T.in_org, `${T.invited} 人待接受`],
  ['已建仓', T.has_repo, T.has_repo ? `共 ${fmt(T.files)} 个文件` : '开营后开始'],
  ['有产出', T.has_output, `${T.has_daily} 人有日报`],
];
document.getElementById('kpis').innerHTML = kpis.map(([l,n,d],i)=>
  `<div class="kpi"><div class="n" style="color:${['','','','var(--blue)','var(--green)'][i]||'inherit'}">${fmt(n)}</div>
   <div class="l">${l}</div><div class="d">${d}</div></div>`).join('');

const steps = [
  ['报名', T.roster, 'var(--ink)'],
  ['已交账号', T.has_account, '#5b6b8c'],
  ['已入组织', T.in_org, 'var(--blue)'],
  ['已建仓', T.has_repo, 'var(--purple)'],
  ['有产出', T.has_output, 'var(--green)'],
];
const maxv = Math.max(...steps.map(s=>s[1]), 1);
document.getElementById('funnel').innerHTML = steps.map(([l,v,c])=>
  `<div class="frow"><span>${l}</span>
   <div class="ftrack"><div class="fbar" style="width:${v/maxv*100}%;background:${c}"></div></div>
   <span class="fnum">${fmt(v)}</span></div>`).join('');

document.querySelector('#gtab tbody').innerHTML = DATA.groups.map(g=>
  `<tr><td>${g.name}</td><td class="num">${g.people}</td><td class="num">${g.in_org}</td>
   <td class="num">${g.has_repo||'—'}</td><td class="num">${g.has_output||'—'}</td>
   <td class="num">${g.daily||'—'}</td><td class="num">${fmt(g.files)}</td></tr>`).join('');

const maxInd = Math.max(...DATA.indicators.map(i=>i.people), 1);
document.getElementById('inds').innerHTML = DATA.indicators.map(i=>
  `<div class="ind"><div class="k">${i.key}</div><div class="t">${i.label}</div>
   <div class="v">${i.people}<span>/ ${T.roster} 人</span></div>
   <div class="bar"><i style="width:${i.people/maxInd*100}%"></i></div></div>`).join('');

let filter = 'all';
function renderPeople(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = DATA.people.filter(p=>{
    if (filter === 'has_repo' ? !p.repos : filter !== 'all' && p.status !== filter) return false;
    if (!q) return true;
    return (p.name+p.group+p.code).toLowerCase().includes(q);
  });
  document.getElementById('people').innerHTML = list.length ? list.map(p=>
    `<div class="p" data-i="${DATA.people.indexOf(p)}"><div class="top"><span class="nm">${p.name}</span>
      <span class="s ${p.status}">${STATUS[p.status]}</span></div>
     <div class="gp">${p.group}${p.code?' · '+p.code:''}</div>
     <div class="meta"><span>文件 <b>${p.files}</b></span><span>日报 <b>${p.daily}</b></span>
      <span>证据 <b>${p.evidence}/12</b></span></div>
     <div class="go">查看详情 ›</div></div>`).join('')
    : '<div class="empty">没有符合条件的学员</div>';
}
document.getElementById('q').addEventListener('input', renderPeople);
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); filter = b.dataset.f; renderPeople();
}));
renderPeople();

const dr = document.getElementById('dr'), ov = document.getElementById('ov');
function openDetail(p){
  document.getElementById('dn').textContent = p.name;
  document.getElementById('dg').textContent =
    [p.group, p.code, p.topic].filter(Boolean).join(' · ');
  const evItems = DATA.indicators.map(i=>{
    const has = p.ev && p.ev[i.key];
    return `<div class="${has?'yes':'no'}"><i></i><span>${i.key} ${i.label}</span></div>`;
  }).join('');
  document.getElementById('db').innerHTML = `
    <div class="kv">
      <div><b>${p.files}</b><span>文件</span></div>
      <div><b>${p.daily}</b><span>日报</span></div>
      <div><b>${p.output}</b><span>产出包</span></div>
      <div><b>${p.code_files}</b><span>代码文件</span></div>
      <div><b>${p.images}</b><span>图片</span></div>
      <div><b>${p.repos}</b><span>仓库</span></div>
    </div>
    <h4>近况</h4>
    <p style="margin:0 0 20px;font-size:12.5px;color:var(--mute);line-height:1.8">
      最近推送：${p.pushed || '—'}<br>当前状态：${STATUS[p.status]}
    </p>
    <h4>12 项证据 · 有候选 <b style="color:var(--ink)">${p.evidence}</b> / 12</h4>
    <div class="ev">${evItems}</div>`;
  dr.classList.add('on'); ov.classList.add('on');
}
function closeDetail(){ dr.classList.remove('on'); ov.classList.remove('on'); }
document.getElementById('x').onclick = closeDetail;
ov.onclick = closeDetail;
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeDetail(); });
document.getElementById('people').addEventListener('click', e=>{
  const c = e.target.closest('.p');
  if (c) openDetail(DATA.people[+c.dataset.i]);
});

document.getElementById('foot').innerHTML =
  `数据来源：GitHub 组织 <b>${DATA.org}</b> 的成员、邀请、仓库与目录树，每 10 分钟自动采集并重建本页。<br>
   本页只展示进度与证据存在性，<b>不展示任何评分、GitHub 账号或仓库名称</b>；质量判断由评审人工完成。<br>
   快照时间 ${DATA.snapshot_at}（北京时间）。`;
</script>
</body>
</html>
